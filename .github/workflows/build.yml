name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Disable IPv6 (Fix Network Issues)
      run: |
        sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
        sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libjpeg-dev \
          libpng-dev \
          libfreetype6-dev \
          unzip \
          zip \
          autoconf \
          libtool \
          pkg-config \
          cmake \
          ccache \
          libffi-dev \
          libssl-dev

    - name: Install Pip Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" buildozer setuptools

    - name: Fix Python User-Agent for Buildozer Downloads
      run: |
        SITE_PKGS=$(python3 -c "import site; print(site.getsitepackages()[0])")
        echo "Injecting User-Agent patch into $SITE_PKGS/sitecustomize.py"
        cat << 'EOF' > "$SITE_PKGS/sitecustomize.py"
import urllib.request

class AppURLopener(urllib.request.FancyURLopener):
    version = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

urllib.request._urlopener = AppURLopener()

try:
    opener = urllib.request.build_opener()
    opener.addheaders = [('User-Agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36')]
    urllib.request.install_opener(opener)
except Exception:
    pass
EOF

    - name: Build APK with Smart Retry
      run: |
        unset ANDROID_NDK_HOME
        unset ANDROID_NDK_ROOT
        unset ANDROID_NDK
        
        SUCCESS=0
        for i in {1..3}; do
          echo "=== Attempt $i to build APK ==="
          if buildozer -v android debug; then
            echo "Build Succeeded on attempt $i!"
            SUCCESS=1
            break
          else
            echo "Attempt $i failed. Retrying in 12 seconds..."
            sleep 12
          fi
        done

        if [ $SUCCESS -eq 0 ]; then
          echo "All 3 build attempts failed."
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CornixWinnerPRO-APK
        path: bin/*.apk
