name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Disable IPv6 (Fix Network Issues)
      run: |
        sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
        sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libjpeg-dev \
          libpng-dev \
          libfreetype6-dev \
          unzip \
          zip \
          autoconf \
          libtool \
          pkg-config \
          cmake \
          ccache \
          libffi-dev \
          libssl-dev

    - name: Install Pip Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" buildozer setuptools

    - name: Clean Previous Failed Builds & Build APK
      run: |
        unset ANDROID_NDK_HOME
        unset ANDROID_NDK_ROOT
        unset ANDROID_NDK
        
        # پاکسازی پوشه کش قبلی برای جلوگیری از تداخل نسخه Pillow
        rm -rf .buildozer/android/platform/build-arm64-v8a/build/other_builds/pillow || true
        
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CornixWinnerPRO-APK
        path: bin/*.apk
